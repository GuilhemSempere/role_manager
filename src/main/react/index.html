<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Role Manager - Permission Management</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      (function installRoleManagerAuthBridge() {
        const storageKey = window.roleManagerAuthTokenStorageKey || 'auth_token';
        const eventName = 'parentApp-auth-changed';

        const bridge = {
          getAccessToken() {
            try {
              return window.localStorage.getItem(storageKey);
            } catch (error) {
              return null;
            }
          },
          onAuthChange(callback) {
            if (typeof callback !== 'function') {
              return () => {};
            }

            const handleAuthChange = () => callback();
            window.addEventListener(eventName, handleAuthChange);
            window.addEventListener('storage', handleAuthChange);

            return () => {
              window.removeEventListener(eventName, handleAuthChange);
              window.removeEventListener('storage', handleAuthChange);
            };
          }
        };

        window.parentAppAuth = bridge;
        window.roleManagerAuth = bridge;
      })();
    </script>
  </head>
  <frameset cols="180,*">
    <frame name="menuFrame" src="menu.html" />
    <frame name="managementFrame" src="" />
  </frameset>
</html>
